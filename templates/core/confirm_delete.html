{% extends 'base.html' %}

{% block content %}
<div class="container-fluid d-flex justify-content-center align-items-center" style="min-height: 60vh;">
  <div class="card p-4 border-danger shadow-sm" style="max-width: 480px; width: 100%;">
    <div class="text-center mb-3">
      <i class="bi bi-exclamation-triangle-fill text-danger fs-1"></i>
      <h4 class="fw-bold mt-2">{{ title }}</h4>
      <p class="text-muted small">Are you sure you want to permanently delete <strong>"{{ object }}"</strong>? This action cannot be undone.</p>
    </div>
    <form method="post" class="d-flex gap-2">
      {% csrf_token %}
      <a href="javascript:history.back()" class="btn btn-light w-50">Cancel</a>
      <button type="submit" class="btn btn-danger w-50">Confirm Delete</button>
    </form>
  </div>
</div>
{% endblock %}
