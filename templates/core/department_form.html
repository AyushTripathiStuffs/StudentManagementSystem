{% extends 'base.html' %}

{% block content %}
<div class="container-fluid" style="max-width: 600px;">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <h3 class="fw-bold m-0">{{ title }}</h3>
            <p class="text-muted small m-0">Update department identifier and title</p>
        </div>
        <a href="{% url 'core:department_list' %}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Back
        </a>
    </div>

    <div class="card p-4 shadow-sm border-0">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold small">Department Name</label>
                {{ form.name }}
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold small">Department Code</label>
                {{ form.code }}
            </div>
            <div class="mt-4 text-end">
                <button type="submit" class="btn btn-primary px-4 fw-semibold">
                    <i class="bi bi-check-circle-fill me-1"></i> Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
