{% extends 'base.html' %}

{% block content %}
<div class="container-fluid" style="max-width: 800px;">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <h3 class="fw-bold m-0">Account Profile</h3>
      <span class="text-muted small">Password Changes Used: <strong>{{ user.password_change_count }}/2</strong></span>
    </div>
    <div class="d-flex gap-2 align-items-center">
      <a href="{% url 'accounts:change_password' %}" class="btn btn-outline-danger btn-sm fw-semibold">
        <i class="bi bi-key-fill me-1"></i> Change Password
      </a>
      <span class="badge bg-primary px-3 py-2 text-uppercase">{{ user.role }}</span>
    </div>
  </div>

  <div class="card p-4">
    <form method="post">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold small">First Name</label>
          {{ form.first_name }}
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold small">Last Name</label>
          {{ form.last_name }}
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold small">Email Address</label>
          {{ form.email }}
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold small">Phone Number</label>
          {{ form.phone_number }}
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold small">Residential Address</label>
          {{ form.address }}
        </div>
      </div>
      <div class="mt-4 text-end">
        <button type="submit" class="btn btn-primary px-4 fw-semibold">Save Changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
