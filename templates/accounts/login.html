{% extends 'base.html' %}

{% block auth_content %}
<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="card p-4 shadow-lg border-0" style="max-width: 420px; width: 100%; border-radius: 1.25rem;">
    <div class="text-center mb-4">
      <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow" style="width: 60px; height: 60px;">
        <i class="bi bi-mortarboard-fill fs-2"></i>
      </div>
      <h3 class="fw-bold">Sign In</h3>
      <p class="text-muted small">Access your EduManage student portal</p>
    </div>

    {% if form.errors %}
      <div class="alert alert-danger py-2 small">Invalid username or password.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold small">Username</label>
        {{ form.username }}
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold small">Password</label>
        {{ form.password }}
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
    </form>
  </div>
</div>
{% endblock %}
